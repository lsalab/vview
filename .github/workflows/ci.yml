name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-av
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    
    - name: Make system Python packages available
      run: |
        # Add system Python's site-packages to PYTHONPATH so python3-av is available
        # Get the system Python's site-packages directory
        SYSTEM_SITE=$(/usr/bin/python3 -c "import site; print(':'.join(site.getsitepackages()))" 2>/dev/null || echo "/usr/lib/python3/dist-packages")
        # Add to PYTHONPATH if not already there
        if [ -n "${PYTHONPATH}" ]; then
          echo "PYTHONPATH=${SYSTEM_SITE}:${PYTHONPATH}" >> $GITHUB_ENV
        else
          echo "PYTHONPATH=${SYSTEM_SITE}" >> $GITHUB_ENV
        fi
        # Verify av is importable
        python -c "import av; print(f'PyAV version: {av.__version__}')" || (echo "ERROR: Cannot import av module" && exit 1)
    
    - name: Run tests
      run: |
        pytest

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install flake8
    
    - name: Run flake8
      run: |
        flake8 main.py __main__.py tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 main.py __main__.py tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics


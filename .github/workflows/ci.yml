name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-av python3-pip python3-venv
    
    - name: Check Python version
      run: |
        python3 --version
        python3 -c "import sys; assert sys.version_info >= (3, 11), 'Python 3.11+ required'"
    
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install -r requirements.txt
        python3 -m pip install -r requirements-test.txt
    
    - name: Verify PyAV is available
      run: |
        python3 -c "import av; print(f'PyAV version: {av.__version__}')" || (echo "ERROR: Cannot import av module" && exit 1)
    
    - name: Run tests
      run: |
        python3 -m pytest

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install flake8
    
    - name: Run flake8
      run: |
        flake8 main.py __main__.py tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 main.py __main__.py tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

